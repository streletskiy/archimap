name: Docker dev image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-dev-${{ github.repository }}
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/streletskiy/archimap
  PLANETILER_VERSION: 0.10.2

jobs:
  build:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          runtime_base_tag="$(node scripts/lib/runtime-base-tag.js \
            --planetiler-version "$PLANETILER_VERSION" \
            --dockerfile Dockerfile)"
          build_sha="$(git rev-parse --short HEAD | tr '[:upper:]' '[:lower:]')"
          build_describe="$(git describe --tags --always --dirty)"
          build_latest_tag="$(git tag --list --sort=-v:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$' \
            | head -n 1 || true)"

          {
            echo "runtime_base_image=$IMAGE_NAME:$runtime_base_tag"
            echo "build_sha=$build_sha"
            echo "build_describe=$build_describe"
            echo "build_latest_tag=$build_latest_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check runtime base image
        id: runtime_base
        shell: bash
        env:
          RUNTIME_BASE_IMAGE: ${{ steps.metadata.outputs.runtime_base_image }}
        run: |
          if docker buildx imagetools inspect "$RUNTIME_BASE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish runtime base
        if: steps.runtime_base.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-base
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          tags: ${{ steps.metadata.outputs.runtime_base_image }}
          cache-from: type=gha,scope=archimap-dev-runtime-amd64
          cache-to: type=gha,mode=max,scope=archimap-dev-runtime-amd64

      - name: Build and publish dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:dev
          build-args: |
            PLANETILER_VERSION=${{ env.PLANETILER_VERSION }}
            RUNTIME_BASE_IMAGE=${{ steps.metadata.outputs.runtime_base_image }}
            BUILD_SHA=${{ steps.metadata.outputs.build_sha }}
            BUILD_DESCRIBE=${{ steps.metadata.outputs.build_describe }}
            BUILD_LATEST_TAG=${{ steps.metadata.outputs.build_latest_tag }}
          cache-from: type=gha,scope=archimap-dev-app-amd64
          cache-to: type=gha,mode=max,scope=archimap-dev-app-amd64
