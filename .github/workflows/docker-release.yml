name: Docker release image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/streletskiy/archimap
  PLANETILER_VERSION: 0.10.2

jobs:
  build:
    name: Build and publish linux/amd64,linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use X.Y.Z format, got: $version"
            exit 1
          fi

          runtime_base_tag="$(node scripts/lib/runtime-base-tag.js \
            --planetiler-version "$PLANETILER_VERSION" \
            --dockerfile Dockerfile)"
          build_sha="$(git rev-parse --short HEAD | tr '[:upper:]' '[:lower:]')"
          build_describe="$(git describe --tags --always --dirty)"

          {
            echo "version=$version"
            echo "runtime_base_image=$IMAGE_NAME:$runtime_base_tag"
            echo "build_sha=$build_sha"
            echo "build_describe=$build_describe"
          } >> "$GITHUB_OUTPUT"

      - name: Check runtime base image
        id: runtime_base
        shell: bash
        env:
          RUNTIME_BASE_IMAGE: ${{ steps.metadata.outputs.runtime_base_image }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$RUNTIME_BASE_IMAGE" 2>/dev/null || true)"
          if grep -qE 'Platform:[[:space:]]+linux/amd64' <<< "$inspect" \
            && grep -qE 'Platform:[[:space:]]+linux/arm64' <<< "$inspect"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish runtime base
        if: steps.runtime_base.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-base
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: false
          tags: ${{ steps.metadata.outputs.runtime_base_image }}
          cache-from: |
            type=gha,scope=archimap-dev-runtime-amd64
            type=gha,scope=archimap-release-runtime
          cache-to: type=gha,mode=max,scope=archimap-release-runtime

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            PLANETILER_VERSION=${{ env.PLANETILER_VERSION }}
            RUNTIME_BASE_IMAGE=${{ steps.metadata.outputs.runtime_base_image }}
            BUILD_SHA=${{ steps.metadata.outputs.build_sha }}
            BUILD_DESCRIBE=${{ steps.metadata.outputs.build_describe }}
            BUILD_LATEST_TAG=${{ steps.metadata.outputs.version }}
          cache-from: |
            type=gha,scope=archimap-dev-app-amd64
            type=gha,scope=archimap-release-app
          cache-to: type=gha,mode=max,scope=archimap-release-app

      - name: Verify published tags and platforms
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for tag in "$VERSION" latest; do
            image="$IMAGE_NAME:$tag"
            inspect="$(docker buildx imagetools inspect "$image")"
            grep -qE 'Platform:[[:space:]]+linux/amd64' <<< "$inspect"
            grep -qE 'Platform:[[:space:]]+linux/arm64' <<< "$inspect"
            echo "Verified $image for linux/amd64 and linux/arm64"
          done
