x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  archimap:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_DESCRIBE: ${BUILD_DESCRIBE:-}
        BUILD_LATEST_TAG: ${BUILD_LATEST_TAG:-}
    image: ${ARCHIMAP_IMAGE:-streletskiy/archimap:latest}
    container_name: archimap
    restart: unless-stopped
    logging: *logging
    user: '1000:1000'
    init: true
    mem_limit: ${ARCHIMAP_MEMORY_LIMIT:-1536m}
    cpus: ${ARCHIMAP_CPUS:-2}
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    ports:
      - '${ARCHIMAP_BIND_ADDRESS:-127.0.0.1}:${PORT:-3252}:${PORT:-3252}'
    env_file:
      - .env
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://archimap:archimap@db-postgres:5432/archimap}
      POSTGRES_HOST: ${POSTGRES_HOST:-db-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-archimap}
      POSTGRES_USER: ${POSTGRES_USER:-archimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archimap}
      SYNC_WORKER_URL: http://sync-worker:3253
      PG_POOL_MAX: ${PG_POOL_MAX:-12}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-15000}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_started
      db-postgres:
        condition: service_healthy
      sync-worker:
        condition: service_healthy

  sync-worker:
    image: ${ARCHIMAP_IMAGE:-streletskiy/archimap:latest}
    container_name: archimap-sync-worker
    restart: unless-stopped
    logging: *logging
    init: true
    user: '0:0'
    mem_limit: ${SYNC_WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${SYNC_WORKER_CPUS:-2}
    command: ['node', '--import', 'tsx', 'scripts/sync-worker.ts']
    env_file: [.env]
    environment:
      RUNTIME_ROLE: sync-worker
      SYNC_WORKER_URL: ''
      DB_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://archimap:archimap@db-postgres:5432/archimap}
      PG_POOL_MAX: '4'
      PG_STATEMENT_TIMEOUT_MS: '0'
      PLANETILER_CONTAINER: archimap-planetiler
      OSM2PGSQL_CONTAINER: archimap-osm2pgsql
      REGION_SYNC_OSM2PGSQL_JOBS: '2'
      REGION_SYNC_OSM2PGSQL_CACHE_MB: '512'
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3253/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db-postgres:
        condition: service_healthy
      planetiler:
        condition: service_started
      osm2pgsql:
        condition: service_started

  planetiler:
    image: ghcr.io/onthegomap/planetiler:0.10.2
    container_name: archimap-planetiler
    restart: unless-stopped
    logging: *logging
    mem_limit: ${PLANETILER_MEMORY_LIMIT:-2560m}
    cpus: ${PLANETILER_CPUS:-3}
    entrypoint: ['tail', '-f', '/dev/null']
    volumes:
      - ./data:/data
    environment:
      XDG_CACHE_HOME: /data/cache
      JAVA_TOOL_OPTIONS: '-Xmx1536m'

  osm2pgsql:
    image: iboates/osm2pgsql:2.2.0
    container_name: archimap-osm2pgsql
    restart: unless-stopped
    logging: *logging
    mem_limit: ${OSM2PGSQL_MEMORY_LIMIT:-1g}
    cpus: ${OSM2PGSQL_CPUS:-2}
    entrypoint: ['tail', '-f', '/dev/null']
    volumes:
      - ./data:/data

  redis:
    image: redis:7-alpine
    container_name: archimap-redis
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    cpus: '0.5'
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--save',
        '60',
        '1000',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction'
      ]
    volumes:
      - redis-data:/data

  db-postgres:
    image: imresamu/postgis:16-3.4-bookworm
    container_name: archimap-postgres
    restart: unless-stopped
    logging: *logging
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-8g}
    cpus: ${POSTGRES_CPUS:-4}
    # PostGIS parallel workers and spatial scans can exhaust Docker's 64MB /dev/shm default.
    shm_size: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archimap}
      POSTGRES_USER: ${POSTGRES_USER:-archimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archimap}
    # Web requests and imports share a bounded memory budget; work_mem applies per operation.
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_io_concurrency=2
      - -c
      - wal_buffers=16MB
      - -c
      - log_autovacuum_min_duration=5000
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-archimap} -d ${POSTGRES_DB:-archimap}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  redis-data:
  postgres-data:
