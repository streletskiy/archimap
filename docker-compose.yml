services:
  archimap:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_DESCRIBE: ${BUILD_DESCRIBE:-}
        BUILD_LATEST_TAG: ${BUILD_LATEST_TAG:-}
    image: ${ARCHIMAP_IMAGE:-streletskiy/archimap:latest}
    container_name: archimap
    restart: unless-stopped
    ports:
      - '${PORT:-3252}:${PORT:-3252}'
    env_file:
      - .env
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://archimap:archimap@db-postgres:5432/archimap}
      POSTGRES_HOST: ${POSTGRES_HOST:-db-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-archimap}
      POSTGRES_USER: ${POSTGRES_USER:-archimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archimap}
      # Sidecar tool container names (used by region-sync scripts)
      PLANETILER_CONTAINER: archimap-planetiler
      OSM2PGSQL_CONTAINER: archimap-osm2pgsql
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_started
      db-postgres:
        condition: service_healthy
      planetiler:
        condition: service_started
      osm2pgsql:
        condition: service_started

  planetiler:
    image: ghcr.io/onthegomap/planetiler:0.10.2
    container_name: archimap-planetiler
    restart: unless-stopped
    entrypoint: ['tail', '-f', '/dev/null']
    volumes:
      - ./data:/data
    environment:
      XDG_CACHE_HOME: /data/cache

  osm2pgsql:
    image: iboates/osm2pgsql:2.2.0
    container_name: archimap-osm2pgsql
    restart: unless-stopped
    entrypoint: ['tail', '-f', '/dev/null']
    volumes:
      - ./data:/data
      - ./scripts/region-sync/osm2pgsql-flex.lua:/osm2pgsql-flex.lua:ro

  redis:
    image: redis:7-alpine
    container_name: archimap-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    volumes:
      - redis-data:/data

  db-postgres:
    image: imresamu/postgis:16-3.4-bookworm
    container_name: archimap-postgres
    restart: unless-stopped
    # PostGIS parallel workers and spatial scans can exhaust Docker's 64MB /dev/shm default.
    shm_size: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archimap}
      POSTGRES_USER: ${POSTGRES_USER:-archimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archimap}
    # Tuned for bulk geo-data imports (large COPY + GiST index rebuilds).
    # max_wal_size=4GB      – fewer checkpoints during bulk writes
    # checkpoint_completion_target=0.9 – spread checkpoint I/O
    # shared_buffers=512MB  – hot data cache (¼ of 2 GB container budget is fine)
    # work_mem=64MB         – faster sorts/hashes for GiST index build
    # maintenance_work_mem=512MB – faster CREATE INDEX / ANALYZE
    # effective_io_concurrency=2 – eMMC/SD random-read parallelism
    # wal_buffers=16MB      – buffer WAL in memory before flushing
    # log_autovacuum_min_duration=-1 – keep autovacuum skip noise out of the container log
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_io_concurrency=2
      - -c
      - wal_buffers=16MB
      - -c
      - log_autovacuum_min_duration=-1
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-archimap} -d ${POSTGRES_DB:-archimap}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  redis-data:
  postgres-data:
